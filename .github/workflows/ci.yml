name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t reservenroam-api:ci .

      - name: Smoke test API image
        run: |
          docker run -d --name reservenroam-api -p 3001:3001 reservenroam-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then
              echo
              docker rm -f reservenroam-api
              exit 0
            fi
            sleep 1
          done
          docker logs reservenroam-api
          docker rm -f reservenroam-api
          exit 1
